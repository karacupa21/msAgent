# Experience graph. Off on merge so Skill Evolver behaviour is unchanged.
# Opt in: enabled: true  — or MSAGENT_EXGRAPH_ENABLED=1
# Force off: MSAGENT_EXGRAPH_DISABLED=1 (wins over everything)
# evidence_mode (when on): episodes | hybrid | graph
#   override: MSAGENT_EXGRAPH_EVIDENCE_MODE
version: "1.0"
enabled: false
evidence_mode: hybrid
outcome:
  policy: v1
output:
  directory: exgraph
skills:
  enabled: true
similar:
  min_tools: 0.5
  min_tokens: 0.25
insight:
  min_support: 2
